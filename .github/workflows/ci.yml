name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Playwright runs the site against fixtures (no credentials, no network): the full end-to-end suite.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      # The Docker image must build from a clean checkout (tests/ stays in the context on purpose; see Dockerfile).
      - run: docker build -t dashboard .
